<header>
  <div class="site-shell">

    <div class="utility-bar" style="display:flex; align-items:center; justify-content:space-between; gap:20px;">

      <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
        <div>Saturday, March 8, 2031</div>
        <div>Independent reporting since 1983</div>
      </div>

      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
        <div
          id="ledger-logged-in"
          style="display:none; align-items:center; gap:8px; font-size:11px; line-height:1.2;"
        >
          <span id="ledger-reader-email" style="font-weight:600;"></span>
          <span style="color:#888;">·</span>
          <span>Archive access through <strong id="ledger-reader-year"></strong></span>
          <span style="color:#888;">·</span>
          <button
            type="button"
            onclick="
              try {
                localStorage.removeItem('haldenLedgerEdition');
                localStorage.removeItem('haldenLedgerBook1Unlocked');
                localStorage.removeItem('haldenLedgerReaderEmail');
              } catch (e) {}
              window.location.href='/index.html';
            "
            style="
              border:0;
              padding:0;
              margin:0;
              background:none;
              color:#111;
              font:inherit;
              font-size:11px;
              text-decoration:underline;
              cursor:pointer;
            "
          >
            Sign out
          </button>
        </div>

        <div id="ledger-logged-out" style="font-size:11px; line-height:1.2;">
          <a href="/index.html" style="text-decoration:underline;">Reader access</a>
        </div>
      </div>

    </div>

    <div class="masthead">
      <h1>
        <a href="/2031/index.html" aria-label="The Halden Ledger 2031 home">
          The Halden Ledger
        </a>
      </h1>

      <div class="tagline">
        The facts. The context. Your conclusions.
      </div>
    </div>

    <nav class="nav" aria-label="Coverage areas">
      <span>Science</span>
      <span>Industry</span>
      <span>Policy</span>
      <span>World</span>
    </nav>

  </div>
</header>

<script>
  (function () {
    var loggedOut = document.getElementById('ledger-logged-out');
    var loggedIn = document.getElementById('ledger-logged-in');
    var emailEl = document.getElementById('ledger-reader-email');
    var yearEl = document.getElementById('ledger-reader-year');

    var email = '';
    var edition = '';

    try {
      email = localStorage.getItem('haldenLedgerReaderEmail') || '';
      edition = localStorage.getItem('haldenLedgerEdition') || '';
    } catch (e) {}

    if (email && edition) {
      emailEl.textContent = email;
      yearEl.textContent = edition;
      loggedOut.style.display = 'none';
      loggedIn.style.display = 'flex';
    } else {
      loggedOut.style.display = 'block';
      loggedIn.style.display = 'none';
    }
  })();
</script>
