<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Contact The Halden Ledger."
  />
  <title>Contact | The Halden Ledger</title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .contact-shell {
      width: min(calc(100% - 32px), 760px);
      margin: 0 auto;
      padding: 46px 0 72px;
    }

    .contact-page h1 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 7vw, 4.8rem);
      line-height: .98;
      letter-spacing: -0.03em;
    }

    .contact-dek {
      margin: 0 0 30px;
      color: #3f3f3f;
      font-size: 1.08rem;
      line-height: 1.55;
    }

    .contact-form {
      border-top: 2px solid var(--ink);
      padding-top: 24px;
    }

    .contact-form label {
      display: block;
      margin: 0 0 7px;
      font-family: var(--font-ui);
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      border: 1px solid #bbb;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 11px 12px;
      margin: 0 0 18px;
    }

    .contact-form textarea {
      min-height: 190px;
      resize: vertical;
    }

    .contact-form button {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      padding: 10px 18px;
      font-family: var(--font-ui);
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      cursor: pointer;
    }

    .contact-form button:hover {
      opacity: .88;
    }

    .contact-note {
      margin-top: 16px;
      color: var(--muted);
      font-family: var(--font-ui);
      font-size: .78rem;
      line-height: 1.45;
    }

    .contact-direct {
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
      font-size: .96rem;
    }

    .contact-direct a {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div id="site-header"></div>

  <main class="contact-shell">
    <article class="contact-page">

      <div class="section-label">Contact</div>

      <h1>Contact The Halden Ledger</h1>

      <p class="contact-dek">
        Questions, corrections, tips and general messages can be sent to the Ledger below.
      </p>

      <form class="contact-form" id="contact-form">
        <label for="contact-name">Name</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" />

        <label for="contact-email">Email</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" />

        <label for="contact-subject">Subject</label>
        <input id="contact-subject" name="subject" type="text" />

        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" required></textarea>

        <button type="submit">Send Message</button>

        <div class="contact-note">
          Clicking “Send Message” will open your email app with the message addressed to The Halden Ledger.
        </div>
      </form>

      <div class="contact-direct">
        Prefer email? Write directly to
        <a href="mailto:news@thehaldenledger.com">news@thehaldenledger.com</a>.
      </div>

    </article>
  </main>

  <div id="site-footer"></div>

  <script>
    fetch('header.html')
      .then(response => {
        if (!response.ok) throw new Error('Header failed to load: ' + response.status);
        return response.text();
      })
      .then(html => {
        document.getElementById('site-header').innerHTML = html;
      })
      .catch(error => console.error(error));

    fetch('footer.html')
      .then(response => {
        if (!response.ok) throw new Error('Footer failed to load: ' + response.status);
        return response.text();
      })
      .then(html => {
        document.getElementById('site-footer').innerHTML = html;
      })
      .catch(error => console.error(error));

    document.getElementById('contact-form').addEventListener('submit', function (event) {
      event.preventDefault();

      const name = document.getElementById('contact-name').value.trim();
      const email = document.getElementById('contact-email').value.trim();
      const subject = document.getElementById('contact-subject').value.trim() || 'Message from The Halden Ledger website';
      const message = document.getElementById('contact-message').value.trim();

      let body = '';

      if (name) body += 'Name: ' + name + '\n';
      if (email) body += 'Email: ' + email + '\n';

      if (body) body += '\n';

      body += message;

      const mailto =
        'mailto:news@thehaldenledger.com' +
        '?subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(body);

      window.location.href = mailto;
    });
  </script>

</body>
</html>
