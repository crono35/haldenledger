<header>
  <div class="site-shell">

    <div class="utility-bar" style="display:flex; align-items:center; justify-content:space-between; gap:20px;">

      <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
        <div>Monday, March 8, 2027</div>
        <div>Independent reporting since 1911</div>
      </div>

      <form
        class="header-login"
        action="#"
        method="post"
        style="display:flex; align-items:center; gap:6px; margin:0;"
        onsubmit="return false;"
      >
        <label for="header-email" class="sr-only" style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;">
          Email
        </label>

        <input
          id="header-email"
          name="email"
          type="email"
          placeholder="Email"
          autocomplete="email"
          style="width:145px; padding:5px 7px; border:1px solid #bbb; background:#fff; font:inherit; font-size:12px;"
        />

        <label for="header-password" class="sr-only" style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;">
          Password
        </label>

        <input
          id="header-password"
          name="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          style="width:110px; padding:5px 7px; border:1px solid #bbb; background:#fff; font:inherit; font-size:12px;"
        />

        <button
          type="submit"
          style="padding:5px 10px; border:1px solid #222; background:#222; color:#fff; font:inherit; font-size:12px; cursor:pointer;"
        >
          Sign In
        </button>
      </form>

    </div>

    <div class="masthead">
      <h1>
        <a href="/" aria-label="The Halden Ledger home">
          The Halden Ledger
        </a>
      </h1>

      <div class="tagline">
        The facts. The context. Your conclusions.
      </div>
    </div>

    <div class="nav" aria-label="Coverage areas">
      <span>Science</span>
      <span>Industry</span>
      <span>Policy</span>
      <span>World</span>
    </div>

  </div>
</header>
